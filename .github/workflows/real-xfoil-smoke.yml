name: Real XFOIL Windows smoke test
on:
  push:
    branches:
      - feat/real-xfoil-uiuc-pipeline
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xfoil-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out AeroSuite
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install plotting dependencies
        shell: pwsh
        run: |
          python -m pip install matplotlib
          if ($LASTEXITCODE -ne 0) { throw "Could not install matplotlib" }
      - name: Run unit tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw "Unit tests failed" }
      - name: Download official MIT XFOIL and execute actual solver
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          $zip = Join-Path $env:RUNNER_TEMP "XFOIL6.99.zip"
          $folder = Join-Path $env:RUNNER_TEMP "xfoil-unpacked"
          Invoke-WebRequest -Uri "https://web.mit.edu/drela/Public/web/xfoil/XFOIL6.99.zip" -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $folder -Force
          $solver = Get-ChildItem -LiteralPath $folder -Recurse -File -Filter "xfoil.exe" | Select-Object -First 1
          if (-not $solver) { throw "xfoil.exe was not found in official distribution" }
          Write-Host "Using official XFOIL binary: $($solver.FullName)"
          Get-FileHash -Algorithm SHA256 -LiteralPath $solver.FullName | Format-List

          python -m aerosuite xfoil 2412 0012 --exe $solver.FullName --reynolds 1000000 --alpha-start 0 --alpha-end 2 --alpha-step 2 --iterations 200 --out results/real-naca
          if ($LASTEXITCODE -ne 0) { throw "Native XFOIL simulation failed; logs under results/real-naca" }
          python -m aerosuite compare naca2412 naca0012 --polars results/real-naca --out results/real-comparison
          if ($LASTEXITCODE -ne 0) { throw "Comparison of native XFOIL results failed" }
          $outputs = @("results/real-naca/naca2412.csv", "results/real-naca/naca0012.csv", "results/real-comparison/comparison.json", "results/real-comparison/plots/cl_alpha.png")
          foreach ($output in $outputs) {
            if (-not (Test-Path -LiteralPath $output)) { throw "Missing expected solver artifact: $output" }
          }
          Write-Host "Real XFOIL end-to-end smoke test succeeded."
      - name: Publish real solver outputs and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aerosuite-real-xfoil-smoke
          path: results/
          if-no-files-found: warn
          retention-days: 14
